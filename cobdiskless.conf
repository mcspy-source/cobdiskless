# CobDiskless Configuration
server_ip=192.168.1.100
server_port=3260
network_interface=default
storage_path=G:/
os_images_dir=G:/
games_dir=./games
writeback_dir=./writeback
cache_dir=./cache
default_cache_size_bytes=536870912
log_level=2
max_clients=64
first_run_completed=1
# Embedded HTTP daemon serving /boot.ipxe, /api/enroll, /api/whoami and
# /cob_rename.cmd. 8080 is occupied by another application on this machine.
http_port=18080
auto_arm_vhd_on_boot=1
# NIC boot profile used by auto_arm_vhd_on_boot: auto | realtek | intel | multi.
# "auto" elects the profile from the image's own Network Adapter instances
# (Control\Class\{4d36e972-...}). Pin a value here to stop auto-arming from
# re-running that election on every launch, or override a single image with
# `nic_profile.<image stem> = realtek` (e.g. `nic_profile.m71s = realtek`).
nic_profile=auto

